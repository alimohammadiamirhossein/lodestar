<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="t d">
  <title id="t">Where Lodestar fits</title>
  <desc id="d">An agent asks the Lodestar map first, and can optionally consult an advisor model and hand cheap work to a worker model. In Lodestar, the structure index and the nightly refresh are built; the code graph, experiment table and summary pages are planned.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa0c4"/>
    </marker>
  </defs>
  <rect width="960" height="626" rx="18" fill="#0b1220"/>
  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="32" y="44" font-size="22" font-weight="700" fill="#f4f7fb">Where Lodestar fits</text>
    <text x="32" y="68" font-size="14" fill="#9fb0cc">Lodestar works alone. The models around it are optional context.</text>

    <rect x="32" y="96" width="300" height="44" rx="12" fill="#16203a" stroke="#2a3a5f"/>
    <text x="52" y="124" font-size="16" fill="#f4f7fb">You</text>

    <rect x="32" y="168" width="300" height="200" rx="12" fill="#16203a" stroke="#60a5fa"/>
    <text x="52" y="258" font-size="17" font-weight="600" fill="#f4f7fb">Sonnet 5.5</text>
    <text x="52" y="280" font-size="13" fill="#9fb0cc">main agent: plans, routes, checks</text>
    <rect x="52" y="292" width="88" height="18" rx="9" fill="#60a5fa"/>
    <text x="64" y="305" font-size="11" font-weight="600" fill="#0b1220">YOUR AGENT</text>

    <rect x="640" y="168" width="288" height="92" rx="12" fill="#16203a" stroke="#60a5fa"/>
    <text x="660" y="198" font-size="17" font-weight="600" fill="#f4f7fb">Opus advisor</text>
    <text x="660" y="220" font-size="13" fill="#9fb0cc">plan check, unstick, sign-off</text>
    <rect x="660" y="232" width="70" height="18" rx="9" fill="#6f84a8"/>
    <text x="672" y="245" font-size="11" font-weight="600" fill="#0b1220">OPTIONAL</text>

    <rect x="640" y="276" width="288" height="92" rx="12" fill="#16203a" stroke="#60a5fa"/>
    <text x="660" y="306" font-size="17" font-weight="600" fill="#f4f7fb">DeepSeek worker</text>
    <text x="660" y="328" font-size="13" fill="#9fb0cc">reading, checked coding, grading</text>
    <rect x="660" y="340" width="70" height="18" rx="9" fill="#6f84a8"/>
    <text x="672" y="353" font-size="11" font-weight="600" fill="#0b1220">OPTIONAL</text>

    <rect x="32" y="404" width="896" height="132" rx="14" fill="#2b2410" stroke="#f5b942"/>
    <text x="52" y="434" font-size="17" font-weight="600" fill="#f5b942">Lodestar map</text>
    <text x="170" y="434" font-size="13" fill="#9fb0cc">agents ask it before searching</text>

    <rect x="52" y="452" width="200" height="66" rx="10" fill="#10281f" stroke="#2dd4bf"/>
    <text x="68" y="478" font-size="14" font-weight="600" fill="#f4f7fb">Structure index</text>
    <rect x="68" y="488" width="52" height="18" rx="9" fill="#2dd4bf"/>
    <text x="78" y="501" font-size="11" font-weight="600" fill="#0b1220">BUILT</text>

    <rect x="266" y="452" width="200" height="66" rx="10" fill="none" stroke="#6f84a8" stroke-dasharray="5 4"/>
    <text x="282" y="478" font-size="14" font-weight="600" fill="#c9d6ee">Code graph</text>
    <text x="282" y="502" font-size="12" fill="#9fb0cc">planned: wrap an existing one</text>

    <rect x="480" y="452" width="200" height="66" rx="10" fill="none" stroke="#6f84a8" stroke-dasharray="5 4"/>
    <text x="496" y="478" font-size="14" font-weight="600" fill="#c9d6ee">Experiment table</text>
    <text x="496" y="502" font-size="12" fill="#9fb0cc">planned: runs, configs, metrics</text>

    <rect x="694" y="452" width="214" height="66" rx="10" fill="none" stroke="#6f84a8" stroke-dasharray="5 4"/>
    <text x="710" y="478" font-size="14" font-weight="600" fill="#c9d6ee">Summary pages</text>
    <text x="710" y="502" font-size="12" fill="#9fb0cc">planned: repos, papers, runs</text>

    <rect x="32" y="554" width="896" height="52" rx="12" fill="none" stroke="#6f84a8" stroke-dasharray="5 4"/>
    <text x="52" y="586" font-size="15" font-weight="600" fill="#c9d6ee">Nightly dream</text>
    <text x="170" y="586" font-size="13" fill="#9fb0cc">refresh and brief built; lessons and refining your .md files with undo planned</text>
  </g>
  <g stroke="#8aa0c4" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="182" y1="142" x2="182" y2="162"/>
    <line x1="338" y1="214" x2="634" y2="214" stroke-dasharray="6 4"/>
    <line x1="338" y1="322" x2="634" y2="322"/>
    <line x1="182" y1="372" x2="182" y2="398"/>
  </g>
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" fill="#9fb0cc">
    <text x="410" y="204">consults at decision points</text>
    <text x="430" y="312">hands off cheap work</text>
    <text x="194" y="390">asks first</text>
  </g>
</svg>
